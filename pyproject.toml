[build-system]
requires = ["setuptools>=80", "setuptools-scm[simple]>=9.2"]
build-backend = "setuptools.build_meta"

[project]
name = "oirunner"
dynamic = ["version"]
authors = [{ name = "John Young", email = "jsy1001@cam.ac.uk" }]
description = "Tool to reconstruct images from optint data using BSMEM"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-2.0-only" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
]
dependencies = ["numpy", "astropy", "scipy"]

[project.optional-dependencies]
dev = [
    "tox",
    "tox-uv",
    "black",
    "flake8",
    "flake8-assertive",
    "flake8-docstrings",
    "flake8-alphabetize",
    "pep8-naming",
    "mypy",
    "coverage[toml]",
]

[project.scripts]
makesf = "oirunner.makesf.__main__:main"

[project.urls]
homepage = "https://github.com/jsy1001/oirunner/"
repository = "https://github.com/jsy1001/oirunner.git"

[tool.black]
fast = true

[tool.coverage.run]
source = ["oirunner"]
# omit = ["*/__init__.py"]
command_line = "-m unittest discover"

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
packages = ["oirunner", "tests"]
ignore_missing_imports = true
