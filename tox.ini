[tox]
envlist = flake8,mypy,clean,3.11,3.12,3.13,coverage-report

[testenv]
setenv =
    PYTHONPATH = {toxinidir}
deps =
     -r{toxinidir}/requirements.txt
     coverage[toml]
commands = coverage run --parallel-mode

[testenv:flake8]
skip_install = true
deps =
     flake8
     flake8-assertive
     flake8-docstrings
     flake8-alphabetize
     pep8-naming
commands = flake8 oirunner tests

[testenv:mypy]
skip_install = true
deps =
     mypy
commands = mypy

[testenv:clean]
skip_install = true
deps = coverage[toml]
commands = coverage erase

[testenv:3.{11,12,13}]
depends = clean

[testenv:coverage-report]
skip_install = true
deps = coverage[toml]
parallel_show_output = true
depends =
        3.11
        3.12
        3.13
commands =
         coverage combine
         coverage report --fail-under=75

[flake8]
inherit = false
# exclude = .git,.tox,.eggs
import-order-style = cryptography
docstring-convention = google
max-line-length = 88
extend-ignore = E203
per-file-ignores =
    tests/*:D100,D101,D102,D415
